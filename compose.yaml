
services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/mern_db
      JWT_SECRET: local-development-jwt-secret
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: local-development-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 30d
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
